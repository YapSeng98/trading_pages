# Keeps data/quotes.json and data/quotes.js current, so stocks.html shows fresh prices.
# The cloud environment that runs the daily Claude refresh cannot reach Yahoo Finance; this runner can.
# GitHub's timer reaches this repository 6 to 10 hours late (measured 2026-11-15), so the market job also starts this
# one when one of the two times below has passed and no run has started since (scripts/keep_going.sh).
name: Update stock quotes

on:
  schedule:
    - cron: "20 0 * * 2-6"   # 08:20 SGT, Tue-Sat: after the US close, before the daily refresh
    - cron: "40 9 * * 1-5"   # 17:40 SGT, Mon-Fri: after the Singapore and Malaysia close
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_quotes.py", ".github/workflows/quotes.yml", "data/refresh-request.txt"]   # the last one: the daily refresh asking for fresh data

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch quotes
        run: python3 scripts/update_quotes.py
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- data/quotes.json data/quotes.js; then
            echo "No change."
            exit 0
          fi
          git config user.name "quotes-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json data/quotes.js
          git commit -m "Quotes $(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M SGT')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
