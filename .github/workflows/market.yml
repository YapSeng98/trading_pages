# Keeps three data files current:
#   data/calendar.json     this week's US economic releases (scripts/update_calendar.py)
#   data/xau-state.json    what the report page's engine says about gold right now (scripts/update_gold.js)
#   data/xau-signals.json  the live record: every "go" signal as a paper trade, followed to its stop or target
#   data/news.json         the latest gold headlines for news.html (scripts/update_news.py)
# report.html reads the calendar and the live record, the home page (assets/hub-live.js) fills its market summary
# from the state and the calendar, and the daily Claude refresh reads them for its numbers: the cloud machine it
# runs on cannot reach any price or calendar service; this runner can.
#
# There are no notifications: the owner asked on 2026-10-22 for the alert comments on the issue
# "XAU 信号提醒（自动）" to be removed.
#
# Besides the timer, a push that touches data/refresh-request.txt starts a run: the daily refresh uses that to get
# fresh facts just before it writes, so it does not depend on GitHub's timer being punctual.
name: Update market facts

on:
  schedule:
    - cron: "40 1 * * *"            # 09:40 SGT: fresh facts for the 10:10 daily refresh
    - cron: "2,17,32,47 * * * 1-5"  # every 15 minutes Monday to Friday (UTC), while gold trades: alerts stay prompt
    - cron: "17 */6 * * 0,6"        # every 6 hours at the weekend
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_calendar.py", "scripts/update_news.py", "scripts/update_gold.js", "scripts/xau_track.js", "scripts/update_btc.js", "assets/xau-*.js", "assets/btc-feed.js", "data/refresh-request.txt", ".github/workflows/market.yml"]

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # each script keeps the old file when its source does not answer, so one failing does not block the other.
      # update_gold.js rewrites its files only when something happened or they are close to an hour old, so most
      # of the 15-minute runs end without a commit. A refresh request always gets fresh files.
      - name: Calendar
        run: python3 scripts/update_calendar.py || echo "::warning::calendar not updated"
      - name: News headlines
        run: python3 scripts/update_news.py || echo "::warning::headlines not updated"
      - name: Gold state and live record
        env:
          XAU_FORCE: ${{ github.event_name == 'push' && '1' || '' }}
        run: node scripts/update_gold.js || echo "::warning::gold state not updated"
      - name: Bitcoin state and live record
        env:
          BTC_FORCE: ${{ github.event_name == 'push' && '1' || '' }}
        run: node scripts/update_btc.js || echo "::warning::bitcoin state not updated"
      - name: Commit if the data changed
        run: |
          git add data/calendar.json data/xau-state.json data/xau-signals.json data/news.json data/btc-state.json data/btc-signals.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Market facts $(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M SGT')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
