# Keeps two data files current:
#   data/calendar.json    this week's US economic releases (scripts/update_calendar.py)
#   data/xau-state.json   what the report page's engine says about gold right now (scripts/update_gold.js)
# report.html reads the calendar for its "stay clear of big data" check, the home page (assets/hub-live.js) fills
# its market summary from both, and the daily Claude refresh reads both for its numbers: the cloud machine it runs on cannot reach any price or calendar service; this runner can.
name: Update market facts

on:
  schedule:
    - cron: "40 1 * * *"     # 09:40 SGT: fresh facts for the 10:10 daily refresh (GitHub often starts these late)
    - cron: "17 * * * 1-5"   # every hour Monday to Friday (UTC), while gold trades
    - cron: "17 */6 * * 0,6" # every 6 hours at the weekend
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/update_calendar.py", "scripts/update_gold.js", "assets/xau-*.js", ".github/workflows/market.yml"]

permissions:
  contents: write

concurrency:
  group: market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # each script keeps the old file when its source does not answer, so one failing does not block the other
      - name: Calendar
        run: python3 scripts/update_calendar.py || echo "::warning::calendar not updated"
      - name: Gold state
        run: node scripts/update_gold.js || echo "::warning::gold state not updated"
      - name: Commit if the data changed
        run: |
          git add data/calendar.json data/xau-state.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "market-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Market facts $(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M SGT')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
